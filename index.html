<!DOCTYPE html>

    #app {
      min-height: 100vh;

    header {

    main {

      padding: 20px;

    .room-box {
      background: white;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .room-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .room-row .input {
      flex: 1;
      min-width: 180px;
      margin: 0;

    .small-button {
      border: 0;

    @media (max-width: 800px) {

    .panel {
      background: white;

    }

      gap: 10px;

    .item-main {
      flex: 1;
    }

    .item-title {

    }

    .completed {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .meta {

      color: #6b7280;
      margin-top: 5px;

    .stat-card {

    .stat-number {

    .empty {

  </style>
</head>

<body>

<!-- LOGIN -->

          <div>

            <div class="panel">

      <!-- SCHEDULE -->
      <section id="scheduleSection" class="section">

        <div class="panel">

          <h2>📅 일정</h2>

          <div class="add-row">

            <input
              id="eventTitleInput"
              class="input"
              placeholder="일정 이름"
            >

            <input
              id="eventDateInput"
              class="input"
              type="date"
            >

            <input
              id="eventTimeInput"

      <section id="statsSection" class="section">

              id="completedTaskStat"

</div>


<script>

  /* =========================================================
     SUPABASE 설정
     ========================================================= */

  const SUPABASE_URL =
    "https://jzvmedsxyzkukyyeseht.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_TterNhTjzZm76Ywgy19bzA_kpD61xOp";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     전역 변수
     ========================================================= */

  let currentUser = null;
  let currentProfile = null;
  let currentRoom = null;

  let presenceChannel = null;
  let realtimeChannel = null;

  let onlineUsers = new Set();


  /* =========================================================
     DOM
     ========================================================= */

  const loginScreen =
    document.getElementById("loginScreen");

  const app =
    document.getElementById("app");

  const nicknameInput =
    document.getElementById("nicknameInput");

  const passwordInput =
    document.getElementById("passwordInput");

  const loginMessage =
    document.getElementById("loginMessage");


  /* =========================================================
     닉네임 → 내부 이메일
     ========================================================= */

  async function nicknameEmail(nickname) {

    const data =
      new TextEncoder().encode(
        nickname.trim().toLowerCase()
      );

    const hash =
      await crypto.subtle.digest(
        "SHA-256",
        data
      );

    const bytes =
      new Uint8Array(hash);

    const hex =
      Array.from(bytes)
        .map(
          b => b.toString(16).padStart(2, "0")
        )
        .join("");

    return hex + "@checklistshare.local";
  }


  /* =========================================================
     메시지
     ========================================================= */

  function showLoginMessage(message, error = true) {

    loginMessage.textContent = message;

    loginMessage.style.color =
      error ? "#dc2626" : "#16a34a";
  }


  /* =========================================================
     회원가입
     ========================================================= */

  document
    .getElementById("signupButton")
    .addEventListener("click", async () => {

      const nickname =
        nicknameInput.value.trim();

      const password =
        passwordInput.value;

      if (!nickname) {
        showLoginMessage("닉네임을 입력하세요.");
        return;
      }

      if (nickname.length < 2) {
        showLoginMessage(
          "닉네임은 2글자 이상 입력하세요."
        );
        return;
      }

      if (!password || password.length < 6) {
        showLoginMessage(
          "비밀번호는 6자 이상 입력하세요."
        );
        return;
      }

      showLoginMessage(
        "계정을 만드는 중입니다...",
        false
      );

      try {

        const email =
          await nicknameEmail(nickname);

        const { data, error } =
          await supabaseClient.auth.signUp({

            email,
            password,

            options: {
              data: {
                nickname
              }
            }

          });

        if (error) {
          throw error;
        }

        if (data.user) {

          showLoginMessage(
            "계정 생성 완료! 로그인해 주세요.",
            false
          );

          passwordInput.value = "";
        }

      } catch (error) {

        console.error(error);

        showLoginMessage(
          "회원가입 실패: " +
          error.message
        );

      }

    });


  /* =========================================================
     로그인
     ========================================================= */

  document
    .getElementById("loginButton")
    .addEventListener("click", login);


  passwordInput.addEventListener(
    "keydown",
    e => {

      if (e.key === "Enter") {
        login();
      }

    }
  );


  async function login() {

    const nickname =
      nicknameInput.value.trim();

    const password =
      passwordInput.value;

    if (!nickname || !password) {

      showLoginMessage(
        "닉네임과 비밀번호를 입력하세요."
      );

      return;
    }

    showLoginMessage(
      "로그인 중...",
      false
    );

    try {

      const email =
        await nicknameEmail(nickname);

      const { data, error } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });

      if (error) {
        throw error;
      }

      currentUser =
        data.user;

      await startApp();

    } catch (error) {

      console.error(error);

      showLoginMessage(
        "로그인 실패: " +
        error.message
      );

    }

  }


  /* =========================================================
     앱 시작
     ========================================================= */

  async function startApp() {

    loginScreen.classList.add("hidden");

    app.classList.remove("hidden");

    await loadProfile();

    document.getElementById(
      "currentNickname"
    ).textContent =
      currentProfile?.nickname ||
      "사용자";

    await loadMyRoom();

  }


  /* =========================================================
     프로필
     ========================================================= */

  async function loadProfile() {

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if (error) {

      console.error(error);

      return;
    }

    currentProfile = data;

  }


  /* =========================================================
     기존 방 찾기
     ========================================================= */

  async function loadMyRoom() {

    const { data, error } =
      await supabaseClient
        .from("room_members")
        .select(`
          room_id,
          rooms (
            id,
            room_code,
            name,
            created_by,
            created_at
          )
        `)
        .eq("user_id", currentUser.id)
        .limit(1);

    if (error) {

      console.error(error);

      return;
    }

    if (data && data.length > 0) {

      currentRoom =
        data[0].rooms;

      await showRoom();

    }

  }


  /* =========================================================
     방 만들기
     ========================================================= */

  document
    .getElementById("createRoomButton")
    .addEventListener(
      "click",
      createRoom
    );


  async function createRoom() {

    const roomName =
      document
        .getElementById("roomNameInput")
        .value.trim() ||
      "CheckList Share Room";

    const roomCode =
      generateRoomCode();

    const { data: room, error } =
      await supabaseClient
        .from("rooms")
        .insert({

          room_code: roomCode,
          name: roomName,
          created_by: currentUser.id

        })
        .select()
        .single();

    if (error) {

      alert(
        "방 생성 실패: " +
        error.message
      );

      return;
    }

    const { error: memberError } =
      await supabaseClient
        .from("room_members")
        .insert({

          room_id: room.id,
          user_id: currentUser.id

        });

    if (memberError) {

      alert(
        "방 참여 처리 실패: " +
        memberError.message
      );

      return;
    }

    currentRoom = room;

    await showRoom();

  }


  /* =========================================================
     방 코드 생성
     ========================================================= */

  function generateRoomCode() {

    const chars =
      "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < 8; i++) {

      result +=
        chars[
          Math.floor(
            Math.random() * chars.length
          )
        ];

    }

    return result;

  }


  /* =========================================================
     방 참여
     ========================================================= */

  document
    .getElementById("joinRoomButton")
    .addEventListener(
      "click",
      joinRoom
    );


  async function joinRoom() {

    const code =
      document
        .getElementById("joinCodeInput")
        .value
        .trim()
        .toUpperCase();

    if (code.length !== 8) {

      alert(
        "8자리 방 코드를 입력하세요."
      );

      return;
    }

    const { data: room, error } =
      await supabaseClient
        .from("rooms")
        .select("*")
        .eq("room_code", code)
        .maybeSingle();

    if (error) {

      alert(
        "방 검색 실패: " +
        error.message
      );

      return;
    }

    if (!room) {

      alert(
        "존재하지 않는 방입니다."
      );

      return;
    }

    const { error: memberError } =
      await supabaseClient
        .from("room_members")
        .upsert(
          {
            room_id: room.id,
            user_id: currentUser.id
          },
          {
            onConflict:
              "room_id,user_id"
          }
        );

    if (memberError) {

      alert(
        "방 참여 실패: " +
        memberError.message
      );

      return;
    }

    currentRoom = room;

    await showRoom();

  }


  /* =========================================================
     방 화면
     ========================================================= */

  async function showRoom() {

    document
      .getElementById("noRoomArea")
      .classList.add("hidden");

    document
      .getElementById("roomArea")
      .classList.remove("hidden");

    document
      .getElementById("mainContent")
      .classList.remove("hidden");

    document
      .getElementById("roomName")
      .textContent =
      currentRoom.name;

    document
      .getElementById("roomCode")
      .textContent =
      currentRoom.room_code;

    await loadAll();

    startRealtime();

    startPresence();

    startExpiredScheduleTimer();

  }


  /* =========================================================
     전체 데이터
     ========================================================= */

  async function loadAll() {

    await archiveExpiredEvents();

    await Promise.all([
      loadTasks(),
      loadEvents(),
      loadMemos(),
      loadMembers(),
      loadNotifications(),
      loadHistory()
    ]);

    updateStats();

  }


  /* =========================================================
     TASK
     ========================================================= */

  document
    .getElementById("addTaskButton")
    .addEventListener(
      "click",
      addTask
    );


  async function addTask() {

    const title =
      document
        .getElementById("taskInput")
        .value.trim();

    const dueInput =
      document
        .getElementById("taskDueInput")

  async function startPresence() {

    if (!currentRoom) {
      return;
    }

    if (presenceChannel) {

      await supabaseClient
        .removeChannel(
          presenceChannel
        );

    }

    presenceChannel =
      supabaseClient.channel(
        "presence-" +
        currentRoom.id,
        {
          config: {
            presence: {
              key: currentUser.id
            }
          }
        }
      );

    presenceChannel
      .on(
        "presence",
        {
          event: "sync"
        },
        () => {

          const state =
            presenceChannel.presenceState();

          onlineUsers =
            new Set();

          Object.values(state)
            .flat()
            .forEach(user => {

              if (user.userId) {

                onlineUsers.add(
                  user.userId
                );

              }

            });

          loadMembers();

        }
      )
      .on(
        "presence",
        {
          event: "join"
        },
        () => {

          loadMembers();

        }
      )
      .on(
        "presence",
        {
          event: "leave"
        },
        () => {

          loadMembers();

        }
      );

    await presenceChannel.subscribe(
      async status => {

        if (
          status ===
          "SUBSCRIBED"
        ) {

          await presenceChannel.track({

            userId:
              currentUser.id,

            nickname:
              currentProfile?.nickname ||
              "사용자",

            onlineAt:
              new Date().toISOString()

          });

        }

      }
    );

  }
